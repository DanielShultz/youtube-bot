services:
  yt-dlp:
    image: jauderho/yt-dlp:latest
    container_name: yt-dlp
    user: "1000:1000"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /home/daniel/media:/media
      - /home/daniel/docker/yt-dlp:/config
    working_dir: /media
    restart: unless-stopped
    networks:
      - bot-network

  kachalnaya_pepega:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kachalnaya-pepega
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /home/daniel/media:/media
      - /home/daniel/docker/bot-stack/bot-data:/app/data
      - ./cookies.txt:/app/cookies.txt
      - ./kachalnaya_pepega:/app/kachalnaya_pepega
    working_dir: /app
    restart: unless-stopped
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge