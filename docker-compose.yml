services:
  yt-dlp:
    image: jauderho/yt-dlp:latest
    container_name: yt-dlp
    user: "1000:1000"
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_DIR}:/media
      - ${YTDLP_CONFIG_DIR}:/config
    working_dir: /media
    restart: unless-stopped
    networks:
      - bot-network

  kachalnaya_pepega:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kachalnaya-pepega
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_DIR}:/media
      - ${BOT_DATA_DIR}:/app/data
      - ${COOKIES_FILE}:/app/cookies.txt
      - ./kachalnaya_pepega:/app/kachalnaya_pepega
    working_dir: /app
    restart: unless-stopped
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge